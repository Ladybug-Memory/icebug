name: matrix build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: 2
  CXX_STANDARD: 20
  MONOLITH: ON
  TLX_PATH: /home/runner/work/networkit/networkit/tlx
  TLX_PATH_WIN: /d/a/networkit/networkit/tlx
  NATIVE: OFF

jobs:
  build:
    name: "${{ matrix.os }} (${{ matrix.arch }}, ${{ matrix.compiler }})"
    runs-on: ${{ matrix.runner }}
    # The gcc-13 builds run in manylinux_2_28 containers (glibc 2.28
    # compatible release binaries); macos/windows/llvm-20 run on their runners.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            compiler: gcc-13
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            cc: gcc
            cxx: g++
          - os: linux
            arch: arm64
            compiler: gcc-13
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cc: gcc
            cxx: g++
          - os: linux
            arch: x86_64
            compiler: llvm-20
            runner: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
          - os: macos
            arch: arm64
            compiler: llvm-20
            runner: macos-15
            cc: /opt/homebrew/opt/llvm@20/bin/clang
            cxx: /opt/homebrew/opt/llvm@20/bin/clang++
          - os: windows
            arch: amd64
            compiler: msvc
            runner: windows-2022
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout networkit
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout tlx
        if: matrix.os != 'windows'
        uses: actions/checkout@v4
        with:
          repository: tlx/tlx
          path: tlx

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ github.ref_name }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.compiler }}-
          max-size: 4G

      - name: Configure ccache
        run: |
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=include_file_mtime
          ccache -p

      - name: Install prerequisites (Linux)
        if: matrix.os == 'linux' && matrix.compiler == 'llvm-20'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc
          echo "deb http://apt.llvm.org/noble llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          wget https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-noble.deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-noble.deb
          sudo apt-get update
          # Arrow's apt repo drops old minors as soon as a new one ships, so an exact pin
          # (libarrow-dev=25.0.0-1) breaks on every upstream release. Pin the whole 25
          # series instead: >= 25.0.0, < 26. The pytest step keys on the SONAME
          # libarrow.so.2500, which is stable across the 25.x series.
          sudo tee /etc/apt/preferences.d/apache-arrow > /dev/null <<'EOF'
          Package: libarrow* apache-arrow*
          Pin: version 25.*
          Pin-Priority: 1001
          EOF
          sudo apt-get install -y clang-20 libomp-20-dev ninja-build libarrow-dev

      - name: Install prerequisites (Linux)
        if: matrix.os == 'linux' && matrix.compiler == 'gcc-13'
        run: |
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled powertools
          dnf install -y epel-release
          # Arrow RPMs have a GPG key mismatch, so we use --nogpgcheck.
          dnf install -y https://apache.jfrog.io/artifactory/arrow/centos/$(cut -d: -f5 /etc/system-release-cpe)/apache-arrow-release-latest.rpm
          dnf install -y --nogpgcheck --enablerepo=epel arrow-devel arrow-compute-devel ninja-build ccache
          dnf install -y cmake git wget unzip gcc-toolset-13

      - name: Install prerequisites (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install apache-arrow
          if [[ "${{ matrix.compiler }}" == "llvm-20" ]]; then
            brew install libomp
            brew reinstall llvm@20
          fi

      - name: Create vcpkg manifest (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cat > vcpkg.json << 'EOF'
          {
            "name": "networkit-deps",
            "version": "1.0.0",
            "dependencies": [
              "arrow"
            ]
          }
          EOF

      - name: Setup vcpkg (Windows)
        if: matrix.os == 'windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Authenticate vcpkg NuGet (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nuget = & $env:VCPKG_ROOT/vcpkg fetch nuget | Out-String
          $nuget = $nuget.Trim()
          & $nuget sources add -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Name "GitHubPackages" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText -Verbosity detailed
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Install vcpkg packages (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          & $env:VCPKG_ROOT/vcpkg install --recurse --clean-after-build --triplet x64-windows
        env:
          VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite'

      - name: Setup devCmd (vstools)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run clang-format check (Linux)
        if: matrix.os == 'linux' && matrix.compiler != 'gcc-13'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc
          echo "deb http://apt.llvm.org/noble llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm18.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          ./check_code.sh

      - name: Build and test (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir build && cd build
          cmake -GNinja -DNETWORKIT_STATIC=ON -DNETWORKIT_BUILD_TESTS=ON -DNETWORKIT_MONOLITH=ON -DNETWORKIT_CXX_STANDARD=${{ env.CXX_STANDARD }} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ..
          ninja
          ctest -V -C Debug
        env:
          VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite'

      - name: Prepare environment and run checks (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          if [ "${{ matrix.compiler }}" = "gcc-13" ]; then source /opt/rh/gcc-toolset-13/enable; fi
          .github/workflows/scripts/cpp_only.sh
        shell: bash

      - name: Setup uv (Linux)
        if: matrix.os == 'linux' && matrix.compiler != 'gcc-13'
        uses: astral-sh/setup-uv@v5

      - name: Run pytest (Linux)
        if: matrix.os == 'linux' && matrix.compiler != 'gcc-13'
        run: |
          uv sync --extra pytest
          uv pip install -e ".[test]"
          # https://github.com/apache/arrow/issues/50648
          sys_libarrow=$(ldconfig -p | grep libarrow.so.2500 | awk '{print $NF}')
          sudo apt remove libarrow2500 -y
          sudo cp $(find .venv -name 'libarrow.so.2500') ${sys_libarrow}
          uv run pytest
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

  release-build:
    name: "Release build (${{ matrix.os }}-${{ matrix.arch }}, ${{ matrix.compiler }})"
    # Skip on PRs — release artifacts are only needed on main and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    # Linux release binaries are built in manylinux_2_28 containers so they are
    # usable on glibc >= 2.28; macOS/Windows build on their own runners.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            compiler: gcc-13
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            cc: gcc
            cxx: g++
            artifact_name: icebug-linux-x86_64
            archive: icebug-linux-x86_64.tar.gz
          - os: linux
            arch: arm64
            compiler: gcc-13
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cc: gcc
            cxx: g++
            artifact_name: icebug-linux-arm64
            archive: icebug-linux-arm64.tar.gz
          - os: linux
            arch: x86_64
            compiler: llvm-20
            runner: ubuntu-latest
            cc: clang-20
            cxx: clang++-20
            artifact_name: icebug-linux-x86_64-perf
            archive: icebug-linux-x86_64-perf.tar.gz
          - os: linux
            arch: arm64
            compiler: llvm-20
            runner: ubuntu-24.04-arm
            cc: clang-20
            cxx: clang++-20
            artifact_name: icebug-linux-arm64-perf
            archive: icebug-linux-arm64-perf.tar.gz
          - os: macos
            arch: arm64
            compiler: llvm-20
            runner: macos-15
            cc: /opt/homebrew/opt/llvm@20/bin/clang
            cxx: /opt/homebrew/opt/llvm@20/bin/clang++
            artifact_name: icebug-macos-arm64
            archive: icebug-macos-arm64.tar.gz
          - os: windows
            arch: amd64
            compiler: msvc
            runner: windows-2022
            cc: cl
            cxx: cl
            artifact_name: icebug-win-amd64
            archive: icebug-win-amd64.zip
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install prerequisites (Linux, manylinux gcc-13)
        if: matrix.os == 'linux' && matrix.compiler == 'gcc-13'
        run: |
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled powertools
          dnf install -y epel-release
          # Arrow RPMs have a GPG key mismatch, so we use --nogpgcheck.
          dnf install -y https://apache.jfrog.io/artifactory/arrow/centos/$(cut -d: -f5 /etc/system-release-cpe)/apache-arrow-release-latest.rpm
          dnf install -y --nogpgcheck --enablerepo=epel arrow-devel arrow-compute-devel ninja-build ccache
          dnf install -y cmake git wget unzip gcc-toolset-13

      - name: Enable gcc-13 toolset (Linux container)
        if: matrix.os == 'linux' && matrix.compiler == 'gcc-13'
        run: |
          source /opt/rh/gcc-toolset-13/enable
          echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-13/root/usr/lib64:/opt/rh/gcc-toolset-13/root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install prerequisites (Linux, llvm-20 perf)
        if: matrix.os == 'linux' && matrix.compiler == 'llvm-20'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc
          echo "deb http://apt.llvm.org/noble llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          wget https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-noble.deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-noble.deb
          sudo apt-get update
          # Same 25-series pin as the PR build: >= 25.0.0, < 26.
          sudo tee /etc/apt/preferences.d/apache-arrow > /dev/null <<'EOF'
          Package: libarrow* apache-arrow*
          Pin: version 25.*
          Pin-Priority: 1001
          EOF
          sudo apt-get install -y clang-20 libomp-20-dev ninja-build libarrow-dev

      - name: Install prerequisites (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install apache-arrow libomp
          brew reinstall llvm@20

      - name: Create vcpkg manifest (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cat > vcpkg.json << 'EOF'
          {
            "name": "networkit-deps",
            "version": "1.0.0",
            "dependencies": [
              "arrow"
            ]
          }
          EOF

      - name: Setup vcpkg (Windows)
        if: matrix.os == 'windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Authenticate vcpkg NuGet (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $nuget = & $env:VCPKG_ROOT/vcpkg fetch nuget | Out-String
          $nuget = $nuget.Trim()
          & $nuget sources add -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Name "GitHubPackages" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText -Verbosity detailed
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Install vcpkg packages (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          & $env:VCPKG_ROOT/vcpkg install --recurse --clean-after-build --triplet x64-windows
        env:
          VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite'

      - name: Setup devCmd (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-${{ github.ref_name }}
          restore-keys: |
            release-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-
          max-size: 2G

      - name: Configure (Linux)
        if: matrix.os == 'linux'
        run: |
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/dist \
            -DNETWORKIT_MONOLITH=ON \
            -DNETWORKIT_CXX_STANDARD=${{ env.CXX_STANDARD }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -B release_build -S .

      - name: Configure (macOS)
        if: matrix.os == 'macos'
        run: |
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist \
            -DNETWORKIT_MONOLITH=ON \
            -DNETWORKIT_CXX_STANDARD=${{ env.CXX_STANDARD }} \
            -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -B release_build -S .

      - name: Configure (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
            -DNETWORKIT_STATIC=ON \
            -DNETWORKIT_MONOLITH=ON \
            -DNETWORKIT_CXX_STANDARD=${{ env.CXX_STANDARD }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -B release_build -S .
        env:
          VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite'

      - name: Build and install
        run: cmake --build release_build --target install --config Release

      - name: Create archive (Linux / macOS)
        if: matrix.os != 'windows'
        run: tar -czf ${{ matrix.archive }} -C dist .

      - name: Create archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: ${{ matrix.archive }}
          retention-days: 30
